# =========================================================================
# Nginx Configuration for WAHA (WhatsApp HTTP API)
# Domain: waha-core.blancverse.com
# Initial HTTP configuration - SSL will be added by Certbot:
#   sudo certbot --nginx -d waha-core.blancverse.com
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name waha-core.blancverse.com;

    # Essential for WhatsApp media uploads (videos, images, audio, documents)
    # WAHA NestJS server allows up to 50MB by default
    client_max_body_size 64M;

    # Logging
    access_log /var/log/nginx/waha-core.blancverse.com.access.log;
    error_log /var/log/nginx/waha-core.blancverse.com.error.log warn;

    location / {
        # Proxy destination: matches WHATSAPP_API_PORT in your .env (5001)
        proxy_pass http://127.0.0.1:5001;

        # WebSocket support (critical for WAHA real-time events /ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Extended timeouts for media uploads/downloads and long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable proxy buffering for streaming responses / SSE
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
